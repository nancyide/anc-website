name: Publish static website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check local links
        run: python3 scripts/check_site.py
      - name: Require published dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view datasets-2026-09-25 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$draft" != "false" ]; then
            echo "Publish and verify the dataset release before deploying the website."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
